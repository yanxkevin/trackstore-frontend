<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0">
        
        <div class="card-header bg-warning text-white text-center py-3">
          <h3 class="mb-0">
            <i class="fa fa-key"></i> Recuperar Senha
          </h3>
        </div>
        
        <div class="card-body p-4">
          
          <div *ngIf="erro" class="alert alert-danger">
            <i class="fa fa-exclamation-circle"></i> {{ erro }}
          </div>
          <div *ngIf="sucesso" class="alert alert-success">
            <i class="fa fa-check-circle"></i> {{ sucesso }}
          </div>

          <p class="text-muted text-center mb-3">
            Digite seu e-mail cadastrado e nós geraremos uma nova senha temporária.
          </p>

          <div class="mb-3">
            <label for="email" class="form-label fw-bold">
              <i class="fa fa-envelope"></i> E-mail
            </label>
            <input 
              type="email" 
              class="form-control form-control-lg"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="off"
              required
            >
          </div>

          <button (click)="recuperarSenha()" class="btn btn-warning btn-lg w-100 text-white mb-3">
            <i class="fa fa-paper-plane"></i> Enviar Nova Senha
          </button>

          <div class="text-center">
            <a (click)="irParaLogin()" class="text-decoration-none cursor-pointer text-warning fw-bold">
              <i class="fa fa-arrow-left"></i> Voltar para o Login
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
