<div class="fundo-genero" [style.backgroundImage]="'url(' + fundoImagem + ')'">
  <div class="overlay">
    
    <!-- MENSAGENS -->
    <div class="container" *ngIf="mensagemSucesso || mensagemErro">
      <div *ngIf="mensagemSucesso" class="alert alert-success alert-dismissible fade show mt-3">
        <i class="fa fa-check-circle"></i> {{ mensagemSucesso }}
      </div>
      <div *ngIf="mensagemErro" class="alert alert-danger alert-dismissible fade show mt-3">
        <i class="fa fa-lock"></i> {{ mensagemErro }}
      </div>
    </div>

    <div class="container">
      <button class="btn-voltar" (click)="voltar()"><i class="fa fa-arrow-left"></i> Voltar</button>
    </div>

    <div class="container text-center titulo-genero">
      <h1 class="display-3" [style.color]="getCorGenero()">🎵 {{ getNomeGenero() }}</h1>
    </div>

    <div class="container pb-4">
      <div *ngIf="albuns.length === 0" class="text-center py-5">
        <h3 class="text-white">😕 Nenhum álbum encontrado</h3>
      </div>

      <div *ngIf="albuns.length > 0" id="carouselAlbuns" class="carousel slide" data-bs-ride="false">
        <div class="carousel-inner">
          <div class="carousel-item" *ngFor="let grupo of albunsAgrupados; let i = index" [class.active]="i === 0">
            
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-md-4 px-2 justify-content-start">
              <div class="col" *ngFor="let album of grupo">
                <div class="card h-100 shadow-sm">
                  <img [src]="album.imagem" [alt]="album.nome" class="card-img-top">
                  <div class="card-body">
                    <h6 class="card-title" title="{{ album.nome }}">{{ album.nome }}</h6>
                    <p class="card-text text-muted">{{ album.artista }}</p>
                    <p class="card-text">
                      <span class="badge" [style.background-color]="getCorGenero()">{{ album.genero }}</span>
                      <span class="badge bg-info ms-1">{{ album.ano }}</span>
                    </p>
                    <h6 class="text-success mb-0">R$ {{ album.preco | number:'1.2-2' }}</h6>
                  </div>
                  <div class="card-footer d-flex justify-content-between">
                    
                    <!-- BOTÃO DETALHES: Vai para a página de detalhes -->
                    <button class="btn btn-outline-primary btn-sm" [routerLink]="['/detalhes', album.id]" title="Detalhes">
                      <i class="fa fa-info-circle"></i>
                    </button>
                    
                    <!-- BOTÃO COMPRAR: Muda de cor e envia para o banco -->
                    <button 
                      class="btn btn-sm fw-bold" 
                      [class.btn-primary]="!album.adicionado"
                      [class.btn-success]="album.adicionado"
                      (click)="adicionarCesta(album)" 
                      title="Comprar">
                      <i class="fa" [class.fa-shopping-cart]="!album.adicionado" [class.fa-check]="album.adicionado"></i>
                      {{ album.adicionado ? 'Adicionado!' : '' }}
                    </button>

                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselAlbuns" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselAlbuns" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>
  </div>
</div>
